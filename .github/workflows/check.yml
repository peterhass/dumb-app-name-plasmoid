name: Check and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/names.test.cjs
      - run: python -m pip install PySide6-Essentials==6.11.2
      - name: Parse QML
        run: |
          pyside6-qmlformat contents/ui/main.qml > /dev/null
          pyside6-qmlformat contents/ui/ActiveApplication.qml > /dev/null
      - run: python tests/test_active_application.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dumb-app-name-plasmoid
          path: dist/dumb-app-name-plasmoid.plasmoid
